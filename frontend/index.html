<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Локальный Анализатор Резюме</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container">
    <h1>📊 Автономный ИИ-Анализатор стоимости резюме</h1>

    <form id="resumeForm">
        <div class="form-group">
            <label for="fullName">ФИО / Псевдоним</label>
            <input type="text" id="fullName" placeholder="Иванов Иван Петрович" required>
        </div>

        <div class="form-group">
            <label for="targetJob">Желаемая профессия или должность (Любая)</label>
            <input type="text" id="targetJob" placeholder="Например: Go-разработчик, Системный аналитик, Маркетолог" required>
        </div>

        <div class="form-group">
            <label for="experienceYears">Подтвержденный опыт работы (лет)</label>
            <input type="number" id="experienceYears" min="0" max="40" step="0.1" value="1" required>
        </div>

        <div class="form-group">
            <label for="skillsText">Ключевые навыки (Хард-скиллы через запятую)</label>
            <input type="text" id="skillsText" placeholder="Docker, Git, Python, SQL, REST API" required>
        </div>

        <div class="form-group">
            <label for="experienceText">Описание опыта работы и реализованных проектов</label>
            <textarea id="experienceText" placeholder="Опишите ваши обязанности, стек и достижения..." required></textarea>
        </div>

        <button type="submit" id="submitBtn">
            <span id="btnText">Рассчитать вилку дохода</span>
            <div class="spinner" id="spinner"></div>
        </button>
    </form>

    <div class="result-box" id="resultBox">
        <h2 style="margin-top:0; font-size: 18px; color: #234e52;" id="positionTitle">Определенная позиция:</h2>
        <div class="salary-range" id="salaryRange">0 — 0 ₽</div>

        <h3 style="font-size: 16px; margin-bottom: 8px; color: #2d3748;">🎯 Рекомендации локального ИИ по улучшению резюме:</h3>
        <ul class="rec-list" id="recList"></ul>

        <button id="recalcBtn" style="margin-top: 25px; background: #4a5568;">🔄 Внести правки и пересчитать</button>
    </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
